<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".72" />
      <stop offset=".4" stop-color="#7c3aed" stop-opacity=".42" />
      <stop offset=".75" stop-color="#7c3aed" stop-opacity=".14" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".68" />
      <stop offset=".4" stop-color="#2563eb" stop-opacity=".4" />
      <stop offset=".75" stop-color="#2563eb" stop-opacity=".13" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line1" gradientUnits="userSpaceOnUse" x1="-80" y1="0" x2="1680" y2="0">
      <stop stop-color="#60a5fa" stop-opacity="0" />
      <stop offset=".5" stop-color="#c4b5fd" stop-opacity=".39" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="line2" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="1660" y2="0">
      <stop stop-color="#60a5fa" stop-opacity="0" />
      <stop offset=".5" stop-color="#c4b5fd" stop-opacity=".25" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#061126" />

  <circle cx="280" cy="160" r="246" fill="url(#violet)">
    <animate attributeName="cx" values="280;440;280" dur="22s" repeatCount="indefinite" />
    <animate attributeName="cy" values="160;260;160" dur="18s" repeatCount="indefinite" />
  </circle>

  <circle cx="1320" cy="690" r="297" fill="url(#blue)">
    <animate attributeName="cx" values="1320;1160;1320" dur="26s" repeatCount="indefinite" />
    <animate attributeName="cy" values="690;580;690" dur="20s" repeatCount="indefinite" />
  </circle>

  <circle cx="900" cy="250" r="161" fill="url(#blue)" opacity=".7">
    <animate attributeName="cy" values="250;390;250" dur="16s" repeatCount="indefinite" />
  </circle>

  <g fill="none" stroke-width="1.5">
    <path stroke="url(#line1)" d="M-80 670 C250 420 470 850 770 600 S1320 280 1680 490">
      <animate attributeName="d" dur="19s" repeatCount="indefinite"
        values="M-80 670 C250 420 470 850 770 600 S1320 280 1680 490;M-80 570 C250 720 470 410 770 640 S1320 390 1680 390;M-80 670 C250 420 470 850 770 600 S1320 280 1680 490" />
    </path>
    <path stroke="url(#line2)" d="M-60 760 C230 520 500 780 810 690 S1340 420 1660 610">
      <animate attributeName="d" dur="24s" repeatCount="indefinite"
        values="M-60 760 C230 520 500 780 810 690 S1340 420 1660 610;M-60 660 C230 750 500 510 810 730 S1340 330 1660 520;M-60 760 C230 520 500 780 810 690 S1340 420 1660 610" />
    </path>
  </g>
