<a
  class="not-prose inline-flex items-center gap-1.5 rounded-full border border-neutral-200/80 bg-white/60 px-3 py-1.5 text-sm font-medium text-neutral-700 backdrop-blur-xl transition-colors hover:border-primary-400 hover:text-primary-600 dark:border-neutral-700/80 dark:bg-neutral-900/50 dark:text-neutral-200 dark:hover:text-primary-400"
  href="{{ .Page.RelPermalink }}">
  {{ .Page.Title }}
  {{ if site.Params.taxonomy.showTermCount | default true }}
    <span class="text-xs text-neutral-500 dark:text-neutral-400">{{ .Count }}</span>
  {{ end }}
</a>
