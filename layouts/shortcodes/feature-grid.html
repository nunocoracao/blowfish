{{ $columns := .Get "columns" | default "3" }}
{{ if not (in (slice "1" "2" "3" "4" "5") $columns) }}
  {{ $columns = "3" }}
{{ end }}
{{ $columnClasses := "" }}
{{ if ne $columns "1" }}
  {{ $columnClasses = printf "lg:grid-cols-%s grid-balance-%s" $columns $columns }}
{{ end }}
<div class="not-prose my-8 grid gap-4 {{ if ne $columns "1" }}sm:grid-cols-2{{ end }} grid-balance {{ $columnClasses }}">
  {{ .Inner }}
</div>
